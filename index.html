function exchange(){
  const c=chat();

  if(sharedNumbers(c)){

  }else if(c.declinedBy){

    body=consentRows(c)+btn('חזרה לשיחה','close','','','message-circle')+quiet('לבטל את הבקשה להחלפה','cancelExchange');
  }else{
    title=theirs?'בקשה מ'+titleOf(chatId)+' להחליף מספרים':'להחליף מספרי טלפון?';
    description=theirs?instructions.received:instructions.phone;
    body=(theirs?consentRows(c):'')+(theirs?'<p>'+instructions.phone+'</p>':'')+btn(theirs?'לאשר ולשתף את המספר שלי':'אני מסכים/ה · לשלוח בקשה','consent','','primary','phone')+(theirs?btn('לא לשתף את המספר שלי','declineExchange','','','shield-check'):'')+quiet('חזרה לשיחה','close');
  }

function decideExchange(action){
  const c=chat();if(!contactAllowed(c)||sharedNumbers(c))return;
  if(action==='retry'&&c.declinedBy===user){delete c.declinedBy;render();exchange();return}
  if(c.declinedBy)return;
  if(action==='approve'&&!c.consent.includes(user)){
    c.consent.push(user);
    if(sharedNumbers(c))event('exchange',user,chatId);
  }else if(action==='decline'&&c.consent.length===1&&c.consent[0]===chatId){
    c.consent=[];c.declinedBy=user;
  }else if(action==='cancel'&&c.consent.length===1&&c.consent[0]===user){
    c.consent=[];closeDialog();render();notify('הבקשה בוטלה. המספרים נשארו פרטיים.');return;
  }else return;

}

 if(e.kind==='teamAid')return e.started?'now':'local';
 if(isUrgent(e))return 'now';
 if(['support','breach'].includes(e.kind))return 'local';
 if(immediateKinds.includes(e.kind))return 'now';
 if(db.settings.routing[e.kind])return db.settings.routing[e.kind];
 return ['suggest','profile','edit','pause','exit','plan'].includes(e.kind)?'local':'now';
}
const when=e=>'<bdi>'+dshort(e.at)+' · '+time(e.at)+'</bdi>';
function safetyOwner(e){
 if(e.owner==='מנהלת תורנית'||e.kind==='alternate')return db.settings.duty;
 return e.owner||rec(e.who)?.worker||db.settings.duty;
}
const mayActOnReport=e=>!e.done&&(role==='admin'||role==='worker'&&worker===safetyOwner(e));
const dutyCaption=()=>db.settings.duty==='נוגה'?'מנהלת המסגרת':'מנהלת הגיבוי';
function managerQueue(){
 const ev=staffEvents(),open=ev.filter(e=>!e.done),counts={regular:open.filter(e=>!isUrgent(e)),urgent:open.filter(isUrgent),open:open.filter(e=>noticeMode(e)==='now'),digest:open.filter(e=>noticeMode(e)==='digest'),local:open.filter(e=>noticeMode(e)==='local'),done:ev.filter(e=>e.done)};
 const items=counts[queueFilter]||counts.open;
 return '<section class="stack"><h2>תיבת הפניות</h2>'+alertTools()+'<div class="filterbar">'+[['urgent','דחופות'],['regular','רגילות'],['open','לטיפול המנהלת'],['local','באחריות הדירות'],['digest','עדכונים מרוכזים'],['done','הסתיים']].map(([k,t])=>choice(t+' · '+counts[k].length,'queueFilter',k,k===queueFilter)).join('')+'</div>'+(items.length?items.slice().sort(managerEventOrder).map(e=>isUrgent(e)?urgentEventRow(e):eventRow(e)).join(''):empty('circle-check',queueFilter==='urgent'?'אין כרגע התראות דחופות':'אין כאן פניות','אירועים חדשים יופיעו כאן לפי ההגדרות.'))+'</section>';
}
const loggedInAfterIntro=r=>r.lastLogin>r.introducedAt;
const waitingForLogin=r=>!['paused','closing','suspended','removed'].includes(r.status)&&!loggedInAfterIntro(r);
const waitingForNext=r=>loggedInAfterIntro(r)&&searches(r.id)&&!r.lastAdvance;

function housingPopulation(){
 return Object.values(db.people).filter(r=>r.status!=='removed').sort((a,b)=>titleOf(a.id).localeCompare(titleOf(b.id),'he'));
}
function contactFollowup(rows){
 const exchanged=new Map(),waiting=new Map();
 for(const e of db.events){
  if(e.kind!=='exchange')continue;
  for(const id of [e.id,e.who])exchanged.set(id,Math.max(exchanged.get(id)||0,e.at));
 }
 for(const c of db.chats){
  if(!contactAllowed(c))continue;
  for(const id of [c.a,c.b]){
   const peer=otherside(c,id);
   const first=c.msg.findIndex(m=>m.from===peer);
   if(first>=0&&!c.msg.slice(first+1).some(m=>m.from===id)){
    const prev=waiting.get(id);waiting.set(id,{count:(prev?.count||0)+1,at:Math.min(prev?.at??Infinity,c.msg[first].t)});
   }
  }
 }
 function group(title,counts,describe,empty){
  const members=rows.filter(r=>allowed(r.id)&&counts.has(r.id));
  const content=members.length?members.map(r=>actionRow(nameWithCity(r.id),describe(counts.get(r.id)),'user-round','staffDetail',r.id)).join(''):'<p>'+empty+'</p>';
  return homeGroup(title,content,members.length);
 }
 return '<section class="card pad stack contact-followup"><h2>מעקב אחר היכרויות</h2>'+
  group('החליפו מספרי טלפון',exchanged,t=>'החלפה אחרונה בהסכמה · '+dshort(t),'עדיין לא היו החלפות מספרים בהסכמה.')+
  group('טרם ענו להודעה ראשונה',waiting,({count,at})=>{
   const days=Math.round((Date.parse(day())-Date.parse(dateFmt.format(at)))/DAY);
   const since=days<=0?'היום':days===1?'אתמול':days===2?'לפני יומיים':'לפני '+days+' ימים';
   return (count===1?'בשיחה פתוחה אחת · ההודעה התקבלה ':'ב־'+count+' שיחות פתוחות · ההודעה המוקדמת התקבלה ')+since;
  },'אין כרגע שיחות שמחכות לתשובה ראשונה.')+
  '<p class="helptext">החיווי מופיע כשנכנסה הודעה ועדיין לא נשלחה תשובה באותה שיחה. כל דייר/ת בוחר/ת אם ומתי לענות.</p></section>';
}
function unitCases(events){

  (role==='worker'?'<div class="worker-urgent">'+urgentPanel(urgent)+'</div>'+alertTools():urgent.length?'<div class="local-urgent"><h3>'+icon('shield-alert')+'התראות דחופות · '+urgent.length+'</h3>'+urgent.map(urgentEventRow).join('')+'</div>':'<p class="urgent-clear">'+icon('circle-check')+'אין כרגע התראות דחופות</p>')+
  (routine.length?'<details class="unit-routine" open><summary>פניות שוטפות · '+routine.length+'</summary>'+routine.map(eventRow).join('')+'</details>':'<p class="muted">אין פניות שוטפות שמחכות לטיפול.</p>')+'</section>';
}
const inPastWeek=t=>t>0&&t>=now()-7*DAY&&t<=now();
const wroteBothThisWeek=c=>[c.a,c.b].every(id=>c.msg.some(m=>m.from===id&&inPastWeek(m.t)));
const weeklyExchanges=id=>db.events.filter(e=>e.kind==='exchange'&&inPastWeek(e.at)&&[e.id,e.who].includes(id)).length;
const weeklyMeasures=[
 ['נכנסו לאפליקציה',r=>active(r.id),r=>loggedInAfterIntro(r)&&inPastWeek(r.lastLogin)],
 ['עברו לפרופיל של אדם אחר',r=>searches(r.id),r=>inPastWeek(r.lastAdvance)],
 ['כתבו בשיחה ששני הצדדים השתתפו בה',r=>searches(r.id),r=>conversations(r.id).some(wroteBothThisWeek)],
 ['החליפו מספרים בהסכמה',r=>searches(r.id),r=>weeklyExchanges(r.id)>0]
];
function rateCell(rows,eligibleFor,met){
 const pool=rows.filter(eligibleFor);
 if(!pool.length)return '<td class="no-sample">אין דיירים בקבוצה</td>';
 const n=pool.filter(met).length,pct=Math.round(100*n/pool.length);
 return '<td><strong><bdi dir="ltr">'+pct+'%</bdi></strong><span class="rate-track" aria-hidden="true"><i style="width:'+pct+'%"></i></span><small>'+n+' מתוך '+pool.length+'</small></td>';
}

function housingFollowup(residents){
 const groups=[
  ['טרם נכנסו מאז ההיכרות',waitingForLogin,'לא נרשמה כניסה עצמאית מאז מפגש ההיכרות.'],

 ];
 return '<div class="pair housing-lists">'+groups.map(([title,filter,description])=>{

   (rows.length?rows.map(r=>{

 ['הסכמה נפרדת לתכנון','בקשת הכנה של צד אחד עדכנה את הצוות.','שיחת הכנה אישית עדיין אפשרית. תכנון משותף נפתח רק אחרי ששני האנשים אישרו בנפרד.','הרכזת עזרה להזמין. ההחלטה לצאת נותרה בידי שני המשתתפים.','2, 3, 8','meeting plan chat journey'],
 ['מקום, זמן והגעה','ניתנו כללי בטיחות כלליים.','מציעים מקום ציבורי ומועד, בוחרים דרך הגעה, והצד השני יכול לאשר או להציע שינוי.','הדוח מתאר הכנה מעשית ומכשולי תחבורה. תכנון דיגיטלי עם אישור לגרסה המוצעת הוא בחירה למוקאפ.','3, 5, 8','plan meeting'],
 ['פרטיות ועזרה בפגישה','אפשר היה לבקש ליווי.','כל צד בוחר בנפרד איפה נוח שהמלווה יישב ואיך לאותת שרוצים לצאת. הבחירה נשארת אצל הדייר והצוות שלו.','הצוות תיאר ישיבה בנפרד ומילת קוד. היקף הליווי משתנה בין הנהלים, ובמוקאפ נקבע עם הדייר.','3, 8','plan desk'],
 ['אחרי שנפגשנו','אפשר היה רק לסמן שהתקיימה פגישה.','כל אחד עונה בפרטיות אם ירצה להיפגש שוב, לחשוב או לעצור. רק שתי תשובות חיוביות פותחות אפשרות למפגש נוסף.','בנוהל המאוחר הרכזת מבררת עם כל משתתף בנפרד, ומציעה גם תמיכה בסיום.','3, 8','after chat journey'],
 ['מקום גם להפסקה','עמדו לבחירה הפסקה או יציאה.','אפשר להמשיך רק בפעילויות, לעצור לגמרי, לסיים שיחה, לבקש עזרה או לחזור בעתיד.','חברות ופעילות חברתית יכולות להימשך גם ללא חיפוש זוגי. מוצע לאפשר מרחק בלי הסבר לקבוצה.','2, 6, 8','pause account activities chat'],
 ['מה קורה אחרי דיווח','הדיווח הקפיא את השיחה והגיע לבדיקה.','למדווח יש שלבים ברורים ואיש קשר. במסך הצד השני מופיע סטטוס ניטרלי. הסיום או חידוש השיחה נשארים בחירה.','הדוח מציע ערוץ טיפול מוגדר. ההקפאה המיידית וכללי החזרה הם החלטות בטיחות של ניצן.','3, 8','report chat case'],
 ['ליווי לבחירת הדייר','הצוות ראה בעיקר עדכונים ופרופילים.','בכרטיס הדייר מוצגים הדרך שבחר, משימות והיסטוריית הליווי. הצעת צוות אינה פותחת צ׳אט.','מרואיינים במחקר נלווה תיארו גם תמיכה מועילה וגם החלטות שהתקבלו בשמם.','2, 6, 8','desk worker journey'],
 ['זמן צוות וחסמי הגעה','מספר הפניות לא הראה כמה עבודה נדרשה.','הצוות יכול לתעד דקות קליטה, תיאום, ליווי או מעקב ולציין קושי בהגעה או בזמינות.','הדוח מפריד בין אירועים לבין תמיכה אישית. לא הוערכו שעות העבודה לדייט בקבוצת ה־96.','5, 6, 9','desk metrics'],
 ['למי יש הזדמנות להכיר','בלוח הופיעו ספירות פעילות וממוצעים.','למנהלת מוצגים אפס, אחד או שניים ויותר מועמדים פנויים לכל מחפש, אחרי העדפות וגבולות. מוצג המכנה.','עמוד 9 מציע את המדד לניצן כדי שממוצע לא יסתיר מי שנשאר בלי הצעה. אין בכך תחזית לזוגיות.','1, 9','metrics manager journey'],
 ['כל שלב והמכנה שלו','היו ספירות נפרדות של שיחות ופגישות.','נספרים צמדים ייחודיים בתוך אותו רצף של הצעה, עניין הדדי, פגישה והסכמה למפגש נוסף.','מספר החברים בנקודת זמן אחת וקשרים שנוצרו לאורך שנים הם מכנים שונים.','1, 4, 9','metrics'],
 ['החוויה של הדייר','הנתונים התמקדו בפעילות ובזוגות.','יש משוב פרטי ורשות לדלג, גם בהפסקה. המנהלת רואה סיכום עם מספר משיבים וללא שמות.','בדוח מופיעות חוויות חברתיות חיוביות וגם פערים בידע על מי שעזבו. שאלות המשוב הן הצעה מקומית.','4, 7, 9','survey account metrics'],
 ['עזרה בקריאה','היו כפתורי הקראה ליד חלק מהטקסטים.','אפשר לכוון את גודל הכתב ואת קצב ההקראה במהלך ההתנסות.','הדוח מציע לשאול אילו עזרי קריאה מתאימים לאדם. הגדלים והמהירויות כאן הם אפשרויות במוקאפ.','6, 8','access service']
];
const researchTargets={
 updates:'העדכונים מהצוות',journey:'מפת המסע',welcome:'כניסה',service:'מה זה בואו נכיר',contract:'הכללים',choices:'מה מתאים לי',interview:'בניית פרופיל',edit:'עריכת פרופיל',preview:'לפני הפרסום',waiting:'ממתינים לצוות',draftRest:'טיוטה בהפסקה',home:'הבית שלי',myProfile:'הפרופיל שלי',exclude:'גבול אישי',discovery:'עיון בפרופילים',requests:'בקשות היכרות',activities:'פעילויות קטנות',chat:'שיחה פרטית',exchange:'החלפת מספרים',meeting:'בקשת פגישה',plan:'תכנון מפגש',after:'אחרי המפגש',pause:'להפסיק או להמשיך',account:'חשבון בהפסקה',report:'דיווח בשיחה',case:'בדיקת דיווח',desk:'ליווי דייר/ת',worker:'המרחב של המלווה',manager:'מרחב המנהלת',metrics:'מדדי הפיילוט',survey:'משוב פרטי',access:'עזרי קריאה'

const cleanPresentation=document.body.hasAttribute('data-clean');
let showRevisionMarks=!cleanPresentation,reviewGroup='all';
function mark(id,html,opts=''){
 if(cleanPresentation)return '<div class="revision '+opts+'">'+html+'</div>';
 return '<div class="revision '+opts+'" data-revision="'+id+'"><button type="button" class="revision-pin" data-act="revision" data-v="'+id+'" aria-label="שינוי '+id+' · '+esc(revisions[id-1][0])+'">'+id+'</button>'+html+'</div>';
}
function refreshReview(){
 document.body.classList.toggle('review-on',!cleanPresentation&&showRevisionMarks);
 const toggle=$('markToggle');if(!toggle)return;toggle.setAttribute('aria-pressed',String(showRevisionMarks));toggle.textContent=showRevisionMarks?'סימונים מוצגים':'סימונים מוסתרים';
}
function openReview(id){
 if(cleanPresentation)return;
 const panel=$('researchDialog'),body=$('researchBody'),item=revisions[id-1];
 const close=round('חזרה למוקאפ','reviewClose','','x');
 if(item){
  body.innerHTML='<div class="dialogtop"><h2 id="reviewTitle">שינוי '+id+' · '+esc(item[0])+'</h2>'+close+'</div><div class="stack"><div class="change-before"><h3>לפני העדכון</h3><p>'+esc(item[1])+'</p></div><div class="change-now"><h3>מה השתנה</h3><p>'+esc(item[2])+'</p></div><div class="box"><h3>למה בחרנו בזה</h3><p>'+esc(item[3])+'</p>'+quiet('להקשיב להסבר','listen',item[2]+' '+item[3],'volume2')+'<small>הדוח המצורף · עמודים <bdi>'+item[4]+'</bdi></small></div><h3>איפה רואים את השינוי?</h3><div class="chips">'+item[5].split(' ').map(k=>quiet(researchTargets[k],'reviewVisit',k+'|'+id,'chevron-left')).join('')+'</div>'+quiet('לכל השינויים','revisionIndex','','chevron-right')+'</div>';
 }else{
  const groups={all:'הכול',resident:'דיירים',team:'צוות ומנהלת'};
  const team=new Set(['desk','case','worker','manager','metrics']);
  const rows=revisions.map((x,i)=>({x,n:i+1})).filter(({x})=>reviewGroup==='all'||x[5].split(' ').some(k=>reviewGroup==='team'?team.has(k):!team.has(k)));
  body.innerHTML='<div class="dialogtop"><h2 id="reviewTitle">מה השתנה בעקבות <bdi>Love4Life</bdi>?</h2>'+close+'</div><div class="stack"><p>'+revisions.length+' שינויים במוקאפ. בכל שינוי אפשר לקרוא את הנימוק ולעבור למסכים שבהם הוא מופיע.</p><p class="helptext">המקור הוא הדוח ״Love4Life בהמפשייר – מחקר והשלכות לניצן״. עמודים 1–7 מתארים עדויות ומגבלות. עמודים 8–9 מציעים יישום בניצן. הקישורים פותחים דמויות ומצבים לדוגמה.</p><div class="filterbar">'+Object.entries(groups).map(([k,t])=>choice(t,'reviewFilter',k,reviewGroup===k)).join('')+'</div><div class="research-list">'+rows.map(({x,n})=>'<button class="option-line" '+act('revision',n)+'><span class="review-number">'+n+'</span><span class="grow"><b>'+esc(x[0])+'</b><small>'+x[5].split(' ').map(k=>researchTargets[k]).join(' · ')+'</small></span>'+icon('chevron-left')+'</button>').join('')+'</div></div>';
 }
 if(!panel.open)panel.showModal();
 panel.scrollTop=0;body.querySelector('h2').tabIndex=-1;body.querySelector('h2').focus({preventScroll:true});
}
function goReviewTarget(k,n){
 $('researchDialog').close();closeDialog();if(n)showRevisionMarks=true;refreshReview();
 if(['worker','manager','metrics','desk','case'].includes(k)){
  if(k==='worker'||k==='desk')worker=rec('dana').worker;
  enterStaff(k==='worker'||k==='desk'?'worker':'admin');
  if(k==='desk'){staffId=n===8?'reviewExample':n===20?'p4':n===12?'p2':'dana';worker=rec(staffId).worker;staffTab='companion'}
  if(k==='metrics')staffTab='metrics';
  if(k==='case'){const e=staffEvents().find(x=>x.kind==='report');if(e){reportCase(e,'desk');render(true)}}
  render(true);
 }else if(k==='access'){accessDialog()}
 else if(k==='updates'){setUser('p11','home');updateHistory()}
 else if(['contract','preview','interview','waiting','draftRest','account'].includes(k)){
  const id={contract:'new',preview:'previewExample',interview:'new',waiting:'reviewExample',draftRest:'draftExample',account:'restExample'}[k];
  setUser(id,k==='interview'?'interview':k);
  if(k==='contract'&&rec().status==='invited'){page='contract';render(true)}
  if(k==='interview'&&rec().status==='invited'){loadInterview();interview=[4,5].includes(n)?5:0;page='interview';render(true)}
  if(k==='preview'&&rec().status==='invited'){loadInterview();page='preview';render(true)}
 }else if(['chat','report','meeting','exchange','plan','after'].includes(k)){
  const pair=k==='after'||k==='chat'&&n===21?['p6','p7']:k==='chat'&&n===23?['p8','p9']:k==='meeting'&&n===19||k==='plan'?['p4','p5']:k==='report'?['michal','avi']:['dana','ron'];
  chatId=pair[1];setUser(pair[0],'chat');
  if(page==='chat'){if(k==='exchange')exchange();else if(k==='report')startReport();else if(k!=='chat')go(k)}
 }else{
  const sample=k==='home'&&n===5||k==='activities'&&n===12?'p2':k==='home'&&[8,9].includes(n)?'p11':'dana';
  setUser(sample,k==='discovery'?'discover':k==='edit'?'home':k);
  if(k==='edit'&&active(user))startEdit();
 }
 if(k==='desk'&&n===12){const e=db.events.find(x=>x.kind==='suggest'&&x.id==='p2');if(e)suggestDialog(e)}
 if(k==='requests'&&n===5&&incoming()[0])profileOptions(incoming()[0].from);
 if(k==='discovery'&&n===5&&browseId)profileOptions(browseId);
 const root=$('dialog').open?$('dialogbody'):$('screen');
 if(n){
  const node=root.querySelector('[data-revision="'+n+'"]');
  if(node){
   for(let parent=node.parentElement;parent&&parent!==root;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;
   node.scrollIntoView({block:'nearest'});node.querySelector('.revision-pin')?.focus({preventScroll:true});
  }
  else notify('המצב של הדמות השתנה במהלך ההדגמה. אפשר להתחיל מחדש בכלי ההדגמה כדי לראות את הדוגמה.');
 }
}

}
function applyPath(id,purpose,way){
 if(!Object.hasOwn(purposes,purpose)||!Object.hasOwn(searchWays,way))return;
 const r=rec(id);r.purpose=purpose;r.way=way;
 if(purpose!=='dating'){
  for(const req of db.requests)if(req.status==='pending'&&[req.from,req.to].includes(id))req.status='closed';
  clearConsentFor(id);
 }
 for(const e of db.events)if(e.kind==='suggest'&&!e.accepted&&(e.id===id&&(!searches(id)||e.candidate&&!opportunity(id,e.candidate))||e.candidate===id&&!opportunity(e.id,id))){e.done=true;e.withdrawn=true}
 if(id===user)resetDeck();
}

}

function draftRest(){const r=rec();return '<div class="pad stack">'+mark(7,pageIntro('אפשר להמשיך אחר כך','הטיוטה שלך מחכה כאן באותה התנסות. אפשר לחזור לשאלה שבה עצרת.')+'<div class="notice">'+esc(steps[r.draft?.step||0])+'</div>'+btn('להמשיך את הפרופיל','draftContinue'))+quiet('לפנות למלווה','help','','phone-call')+'</div>'}
function nextReview(r){const due=(r.reviewAt||r.joined||now())+2*DAY;return '<div class="box stack"><b>איש הקשר שלך · '+esc(r.worker)+'</b><p>'+(now()>due?'מועד העדכון עבר. אפשר לפנות למלווה גם אם עדיין אין החלטה.':'עדכון צפוי בהדגמה עד ' +dshort(due)+'. גם אם הבדיקה תימשך, אפשר לברר כאן.')+'</p>'+quiet('לברר עם הצוות','help','','phone-call')+'</div>'}
function opportunity(a,b){
 return a!==b&&searches(a)&&searches(b)&&compatible(a,b)&&!concealed(a,b)&&!between(a,b)&&!db.requests.some(r=>liveRequest(r)&&[r.from,r.to].includes(a)&&[r.from,r.to].includes(b));
}
function guidedOffer(id=user){return db.events.find(e=>e.kind==='suggest'&&e.id===id&&!e.withdrawn&&!e.accepted&&(!e.done||e.candidate&&opportunity(id,e.candidate)))}
function requestHelpCandidate(person='',activity=''){
 if(!searches(user))return;
 const prior=guidedOffer();if(prior){go('home');notify('כבר יש בקשת הצעה. אפשר לראות אותה בבית.');return}
 if(person&&!opportunity(user,person))return;
 const e=event('suggest',user);e.preferred=person;e.activity=activity;
 go('home');notify('בקשת העזרה הגיעה למלווה בהדגמה.');
}
function guidedHome(){
 if(!searches(user))return '';

 if(e)return mark(5,'<div class="notice">הבקשה אצל '+esc(rec().worker)+'. הצוות יחפש הצעה ויעדכן אותך כאן.</div>');
 return rec().way==='guided'?mark(5,btn('לבקש הצעה מ'+rec().worker,'suggestAsk','','team','users')):'';
}
function openCandidate(id){

 if(!seen.includes(id)&&seen.length>=db.settings.profiles){modal('אפשר לחזור מחר','<p>הגעת לסוף הפרופילים להיום. ההצעה תחכה בבית.</p>'+btn('הבנתי','close'));return}
 if(!seen.includes(id))db.views[user+'|'+day()]=[...seen,id];
 reviewingProfiles=false;deckHistory=deckHistory.slice(0,deckIndex+1);deckHistory.push(id);deckIndex=deckHistory.length-1;browseId=id;stage=0;go('discover');if(previous&&previous!==browseId)rec().lastAdvance=now();
}
const suggestionCandidates=e=>Object.values(db.people).filter(r=>opportunity(e.id,r.id)&&(!e.preferred||e.preferred===r.id));

 if(e.done)return '';

function helpStep(v){
